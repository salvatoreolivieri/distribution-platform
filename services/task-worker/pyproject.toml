[project]
name = "task-worker"
version = "0.1.0"
description = "Delivers each task to the document platform. Ports and adapters, no framework."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "import-linter>=2.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/task_worker/contracts/task_message.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/task_worker/contracts/task_message.py"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# Layer rules. The compiler cannot enforce these in Python, so CI runs `lint-imports`.
[tool.importlinter]
root_package = "task_worker"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: bootstrap -> adapters -> application -> domain"
type = "layers"
layers = [
    "task_worker.bootstrap",
    "task_worker.adapters",
    "task_worker.application",
    "task_worker.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application use no infrastructure libraries"
type = "forbidden"
source_modules = ["task_worker.domain", "task_worker.application"]
forbidden_modules = ["psycopg", "boto3", "botocore", "httpx", "pydantic", "task_worker.contracts"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain depends on nothing else in the worker"
type = "forbidden"
source_modules = ["task_worker.domain"]
forbidden_modules = ["task_worker.application", "task_worker.adapters", "task_worker.bootstrap", "task_worker.contracts"]
