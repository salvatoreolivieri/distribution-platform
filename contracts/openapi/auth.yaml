openapi: 3.0.3
info:
  title: Auth API
  version: 1.0.0
  description: |
    Issues ES256 JWTs signed with a KMS key (kid = key version).
    User tokens come from login/refresh; service tokens come from the client-credentials grant.
servers:
  - url: /
paths:
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
        '422':
          $ref: './common.yaml#/components/responses/ValidationFailed'
  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair; the refresh token is rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh token revoked.
  /v1/auth/token:
    post:
      operationId: issueServiceToken
      tags: [auth]
      description: Client-credentials grant for services such as the task worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentialsRequest'
      responses:
        '200':
          description: Service token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokenEnvelope'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
  /v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: './common.yaml#/components/responses/Unauthenticated'
  /.well-known/openid-configuration:
    get:
      operationId: getOpenIdConfiguration
      tags: [auth]
      description: Discovery document; API Gateway's JWT authorizer reads jwks_uri from it.
      responses:
        '200':
          description: OpenID Provider metadata (issuer and jwks_uri are the fields we rely on).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdConfiguration'
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [auth]
      responses:
        '200':
          description: Public keys for verifying tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
components:
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ClientCredentialsRequest:
      type: object
      required: [clientId, clientSecret, scope]
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          format: password
        scope:
          type: string
          example: documents:ingest
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
        tokenType:
          type: string
          enum: [Bearer]
    TokenPairEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TokenPair'
    ServiceToken:
      type: object
      required: [accessToken, expiresIn, scope]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
        scope:
          type: string
    ServiceTokenEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ServiceToken'
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    OpenIdConfiguration:
      type: object
      required: [issuer, jwks_uri, id_token_signing_alg_values_supported]
      properties:
        issuer:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum: [ES256]
    Jwk:
      type: object
      required: [kty, crv, x, y, kid, alg, use]
      properties:
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        x:
          type: string
        y:
          type: string
        kid:
          type: string
        alg:
          type: string
          enum: [ES256]
        use:
          type: string
          enum: [sig]
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
