name: contracts

# Fails when code generated from contracts/ or db/migrations/ is out of date: run `just gen`
# and commit the result.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - run: npm ci
        working-directory: web
      - run: uv sync --frozen
        working-directory: services/task-worker
      - run: just gen
      - name: Generated code is up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'just gen' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::'just gen' created files that are not committed:"; echo "$untracked"; exit 1
          fi
